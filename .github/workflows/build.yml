name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ReachCursor-project.zip
      - name: Install SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.7.1
      - run: gradle assembleDebug
        working-directory: ReachCursor
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ReachCursor/app/build/outputs/apk/debug/app-debug.apk
